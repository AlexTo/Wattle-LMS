name: Initialize Monorepo
description: Initialize nx monorepo for CI workflows

# Mirrors nx-plugin-for-aws's .github/actions/init-monorepo, trimmed to what
# this workspace needs (no image builds, Bun, Terraform or Smithy).

inputs:
  aws-docker-login-role-arn:
    description: 'ARN of the AWS role to assume to log Docker in to Amazon ECR Public, whose anonymous pulls are rate-limited per IP and shared GitHub runner IPs can exhaust. Leave empty to pull anonymously.'
    required: false
    default: ''
  setup-uv:
    description: 'Install uv/Python. Needed by jobs that run infra:checkov (via `uvx`), i.e. the build target. Disable for jobs that do not run Python tooling.'
    required: false
    default: 'true'
  set-nx-shas:
    description: 'Set NX_BASE/NX_HEAD for `nx affected`. Requires a full-history checkout (fetch-depth: 0). Disable for jobs that do not run `nx affected`.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # Credentials go to step outputs rather than the job environment, so the
    # login role is only ever used by the login step below.
    - name: Docker login credentials
      id: docker-login-credentials
      if: ${{ inputs.aws-docker-login-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-docker-login-role-arn }}
        # ECR Public only issues authorization tokens in us-east-1.
        aws-region: us-east-1
        output-credentials: true
        output-env-credentials: false
    - name: Log in to Amazon ECR Public
      if: ${{ inputs.aws-docker-login-role-arn != '' }}
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ steps.docker-login-credentials.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.docker-login-credentials.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.docker-login-credentials.outputs.aws-session-token }}
      run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
    - name: Use PNPM
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        install: 'false'
    # Node 24 matches the Lambda runtime (nodejs24.x).
    - name: Use Node.js 24.x
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - name: Install the latest version of uv
      if: ${{ inputs.setup-uv == 'true' }}
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: 'latest'
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
    # Newer than nx-plugin-for-aws's pin (v4), which runs on the deprecated
    # Node.js 20 runtime.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      name: Setup pnpm cache
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
    - name: Install Node.js Dependencies
      shell: bash
      run: pnpm i --frozen-lockfile --prefer-offline
    - if: ${{ inputs.set-nx-shas == 'true' }}
      uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
