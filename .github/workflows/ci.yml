name: CI

concurrency:
  group: ci-${{ github.ref }}

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CI: "true"
  NX_DAEMON: "true"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      latest_commit: ${{ steps.git_remote.outputs.latest_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # infra:checkov (part of the build target) invokes checkov via `uvx`, so
      # this job needs uv (init-monorepo's default).
      - uses: ./.github/actions/init-monorepo

      - name: Lint
        run: pnpm nx run-many --target lint --all

      - name: Test
        run: pnpm nx run-many --target test --all

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: pnpm nx run-many --target build --all

      - name: Check for mutations
        run: git diff --ignore-space-at-eol --exit-code

      - name: Check for new commits
        id: git_remote
        run: echo "latest_commit=$(git ls-remote origin -h ${{ github.ref }} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-artifact
          path: docs/dist

  # Separate from `build` so a newly published CVE (Trivy's database changes
  # daily) flags main without blocking the docs deploy. deploy.yml runs the same
  # scan as a gate before deploying.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/init-monorepo
        with:
          # `pnpm trivy` pulls the Trivy image from ECR Public.
          aws-docker-login-role-arn: ${{ vars.AWS_DOCKER_LOGIN_ROLE_ARN }}
          setup-uv: "false"
          set-nx-shas: "false"

      - name: Scan for vulnerabilities and secrets
        run: pnpm trivy

  deploy_docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: [build]
    # Guards against a race where a newer commit landed on main and started
    # its own run while this one was still building.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build.outputs.latest_commit == github.sha }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-artifact
          path: docs-site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: "docs-site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
